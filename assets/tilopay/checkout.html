<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Tilopay Demo</title>
  <script src="https://app.tilopay.com/sdk/v2/sdk_tpay.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #1a1a1a; }
    .wrap { padding: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; border: 1px solid #e8eaed; }
    .amt { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
    .ord { color: #5f6368; font-size: 13px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    input, select { width: 100%; box-sizing: border-box; min-height: 44px; border: 1px solid #e0e0e0; border-radius: 10px; padding: 0 12px; font-size: 16px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; min-width: 0; }
    #btn_pagar { width: 100%; margin-top: 16px; min-height: 48px; border: none; border-radius: 12px; background: #ed1525; color: #fff; font-weight: 700; font-size: 16px; }
    #btn_sinpe { width: 100%; margin-top: 8px; min-height: 42px; border: 1px solid #ffd6d9; border-radius: 12px; background: #fff; color: #b0101c; font-weight: 600; }
    #tilopay_msg { min-height: 1.2em; font-size: 13px; color: #5f6368; }
    #tilopay_msg.is-error { color: #ed1525; font-weight: 600; }
    #sinpe_box { display: none; margin-top: 8px; padding: 10px; background: #fff8e1; border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="amt">₡ <span id="tp_monto_lbl">—</span></p>
      <p class="ord" id="tp_orden_lbl"></p>
      <p id="tilopay_msg"></p>
      <div class="payFormTilopay">
        <div class="row">
          <div>
            <label for="tlpy_payment_method">Método de pago</label>
            <select id="tlpy_payment_method" name="tlpy_payment_method">
              <option value="">Seleccione</option>
            </select>
          </div>
          <div id="tlpy_saved_wrap">
            <label for="tlpy_saved_cards">Tarjetas guardadas</label>
            <select id="tlpy_saved_cards" name="tlpy_saved_cards">
              <option value="">Nueva tarjeta</option>
            </select>
          </div>
        </div>
        <div id="tlpy_card_payment_div">
          <label for="tlpy_cc_number">Número</label>
          <input type="text" id="tlpy_cc_number" name="tlpy_cc_number" inputmode="numeric" autocomplete="off" />
          <div class="row">
            <div>
              <label for="tlpy_cc_expiration_date">Vence (MM/AA)</label>
              <input type="text" id="tlpy_cc_expiration_date" name="tlpy_cc_expiration_date" placeholder="12/28" />
            </div>
            <div>
              <label for="tlpy_cvv">CVV</label>
              <input type="password" id="tlpy_cvv" name="tlpy_cvv" inputmode="numeric" autocomplete="off" />
            </div>
          </div>
        </div>
        <div id="tlpy_phone_number_div" style="display:none">
          <label for="tlpy_phone_number">Teléfono Yappy</label>
          <input type="text" id="tlpy_phone_number" name="tlpy_phone_number" />
        </div>
        <div id="sinpe_box"></div>
        <button type="button" id="btn_pagar">Pagar</button>
        <button type="button" id="btn_sinpe">Ver datos SINPE</button>
      </div>
    </div>
  </div>
  <div id="responseTilopay" style="min-height:40px"></div>
  <script>
    window.__TILOPAY = {
      token: __TOKEN__,
      orderNumber: __ORDER__,
      redirect: __REDIRECT__,
      amount: __AMOUNT__,
      currency: __CURRENCY__,
      email: __EMAIL__,
      firstName: __FIRST__,
      lastName: __LAST__
    };
    (function () {
      var box = document.getElementById("responseTilopay");
      if (box && box.parentElement !== document.body) document.body.appendChild(box);
      var cfg = window.__TILOPAY || {};
      var msg = document.getElementById("tilopay_msg");
      var elM = document.getElementById("tp_monto_lbl");
      var elO = document.getElementById("tp_orden_lbl");
      if (elM) elM.textContent = cfg.amount || "100";
      if (elO) elO.textContent = (cfg.orderNumber || "") + " · " + (cfg.currency || "CRC");
      function setMsg(text, isError) {
        if (!msg) return;
        msg.textContent = text;
        msg.classList.toggle("is-error", !!isError);
      }
      var n = 0;
      function go() {
        if (typeof Tilopay === "undefined") {
          n += 1;
          if (n > 50) { setMsg("No cargó sdk_tpay.min.js", true); return; }
          setTimeout(go, 100);
          return;
        }
        start();
      }
      function start() {
        if (!cfg.token) { setMsg("Token vacío", true); return; }
        Tilopay.Init({
          token: cfg.token,
          currency: cfg.currency || "CRC",
          language: "es",
          amount: String(cfg.amount || "100"),
          billToFirstName: cfg.firstName || "Saul",
          billToLastName: cfg.lastName || "Marin",
          billToAddress: "San Jose",
          billToAddress2: "",
          billToCity: "San Jose",
          billToState: "SJ",
          billToZipPostCode: "10101",
          billToCountry: "CR",
          billToTelephone: "88888888",
          billToEmail: cfg.email,
          orderNumber: cfg.orderNumber,
          capture: 1,
          redirect: cfg.redirect,
          subscription: 0,
          hashVersion: "V2"
        }).then(function (initialize) {
          setMsg("Listo para pagar", false);
          loadOptions("tlpy_payment_method", initialize.methods || []);
          loadOptions("tlpy_saved_cards", initialize.cards || []);
        }).catch(function (e) {
          setMsg("Init falló: " + e, true);
        });
        function loadOptions(selectId, items) {
          var sel = document.getElementById(selectId);
          if (!sel) return;
          items.forEach(function (item) {
            var opt = document.createElement("option");
            opt.value = item.id;
            opt.text = item.name;
            sel.appendChild(opt);
          });
        }
        var selMet = document.getElementById("tlpy_payment_method");
        if (selMet) {
          selMet.onchange = function () {
            var isYappy = ((this.value || "").split(":")[1] === "18");
            document.getElementById("tlpy_card_payment_div").style.display = isYappy ? "none" : "block";
            document.getElementById("tlpy_phone_number_div").style.display = isYappy ? "block" : "none";
            var saved = document.getElementById("tlpy_saved_wrap");
            if (saved) saved.style.display = isYappy ? "none" : "";
          };
        }
        document.getElementById("btn_pagar").onclick = function (ev) {
          if (ev) ev.preventDefault();
          var met = document.getElementById("tlpy_payment_method");
          if (!met || !met.value) { setMsg("Elegí el método de pago.", true); return false; }
          setMsg("Enviando a Tilopay…", false);
          Tilopay.startPayment()
            .then(function (p) { setMsg((p && p.message) || "Procesando pago…", false); })
            .catch(function (e) { setMsg("Pagar error: " + e, true); });
          return false;
        };
        document.getElementById("btn_sinpe").onclick = function () {
          Tilopay.getSinpeMovil().then(function (params) {
            var s = document.getElementById("sinpe_box");
            s.style.display = "block";
            s.textContent = "SINPE tel " + (params.number || "") +
              " monto " + (params.amount || "") +
              " código " + (params.code || "");
          });
        };
      }
      go();
    })();
  </script>
</body>
</html>
