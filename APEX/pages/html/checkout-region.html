<!-- Región HTML de la página Checkout (app 110). IDs de Tilopay: no renombrar. -->
<p id="tilopay_msg" class="hint"></p>

<div class="payFormTilopay">
  <div class="tp-row-2">
    <div class="tp-field">
      <label for="tlpy_payment_method">Método de pago</label>
      <select name="tlpy_payment_method" id="tlpy_payment_method">
        <option value="">Seleccione</option>
      </select>
    </div>
    <div class="tp-field" id="tlpy_saved_wrap">
      <label for="tlpy_saved_cards">Tarjetas guardadas</label>
      <select name="tlpy_saved_cards" id="tlpy_saved_cards">
        <option value="">Nueva tarjeta</option>
      </select>
    </div>
  </div>

  <div id="tlpy_card_payment_div">
    <div class="tp-field">
      <label for="tlpy_cc_number">Número</label>
      <input type="text" id="tlpy_cc_number" name="tlpy_cc_number" autocomplete="off">
    </div>
    <div class="tp-row-2 tp-row-vence">
      <div class="tp-field">
        <label for="tlpy_cc_expiration_date">Vence (MM/AA)</label>
        <input type="text" id="tlpy_cc_expiration_date" name="tlpy_cc_expiration_date">
      </div>
      <div class="tp-field">
        <label for="tlpy_cvv">CVV</label>
        <input type="password" id="tlpy_cvv" name="tlpy_cvv" autocomplete="off">
      </div>
    </div>
  </div>

  <div id="tlpy_phone_number_div" style="display:none">
    <div class="tp-field">
      <label for="tlpy_phone_number">Teléfono Yappy</label>
      <input type="text" id="tlpy_phone_number" name="tlpy_phone_number">
    </div>
  </div>

  <div id="sinpe_box" style="display:none"></div>

  <div class="tp-actions">
    <button type="button" id="btn_pagar">Pagar</button>
    <button type="button" id="btn_sinpe">Ver datos SINPE</button>
  </div>
</div>

<div id="responseTilopay" style="min-height:40px"></div>
