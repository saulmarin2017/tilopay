<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tilopay Demo — Checkout</title>
  <style>
    :root {
      --red: #ed1525;
      --red-dark: #b0101c;
      --text: #1a1a1a;
      --muted: #5f6368;
      --surface: #f5f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--surface);
      min-height: 100vh;
    }
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .side {
      background: linear-gradient(165deg, #5c0810 0%, #7a0a14 45%, #b0101c 100%);
      color: #fff;
      padding: 18px 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; border-bottom: 1px solid rgba(255,255,255,.15); margin-bottom: 14px; }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    .brand strong { display: block; font-size: 14px; }
    .brand span { font-size: 11px; opacity: .75; }
    .nav-item { padding: 10px 12px; border-radius: 10px; font-size: 13.5px; color: rgba(255,255,255,.85); }
    .nav-item.active { background: #ed1525; color: #fff; font-weight: 600; }
    .top {
      background: #b0101c;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top b { font-size: 15px; }
    .main-body { padding: 28px 24px 48px; }
    .tp-checkout {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 32px rgba(22, 0, 101, 0.08);
      overflow: hidden;
    }
    .hero {
      display: flex; align-items: center; gap: 14px;
      padding: 1.15rem 1.35rem;
      background: linear-gradient(135deg, #b0101c 0%, #ed1525 100%);
      color: #fff;
    }
    .hero img { width: 48px; height: 48px; border-radius: 12px; background: #fff; }
    .kicker { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; font-weight: 600; }
    .hero h1 { margin: 2px 0 0; font-size: 1.25rem; }
    .amount { margin: 1.1rem 1.35rem 0; padding: 1rem 1.1rem; border-radius: 14px; background: #fff5f5; border: 1px solid #ffd6d9; }
    .amount .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
    .amount strong { display: block; font-size: 1.85rem; letter-spacing: -.03em; margin: 2px 0 4px; }
    .amount small { color: var(--muted); font-size: 12px; }
    form { padding: 1.1rem 1.35rem 0.4rem; display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 13px; font-weight: 600; margin-top: 0.55rem; }
    input, select {
      width: 100%; min-height: 44px; border: 1px solid #e0e0e0; border-radius: 10px; padding: 0 12px; font-size: 15px;
    }
    .pay { min-height: 48px; margin-top: 1rem; border: none; border-radius: 12px; background: var(--red); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
    .sinpe { min-height: 42px; margin-top: 8px; border: 1px solid #ffd6d9; border-radius: 12px; background: #fff; color: var(--red-dark); font-weight: 600; cursor: pointer; }
    .secure { margin: 0.5rem 1.35rem 1.2rem; font-size: 12px; color: var(--muted); text-align: center; }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      .side { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img src="../../assets/tilopay_icon.svg" alt="" />
        <div><strong>Tilopay Demo</strong><span>App 110 · sandbox</span></div>
      </div>
      <div class="nav-item active">Checkout</div>
      <div class="nav-item">Callback</div>
    </aside>
    <div>
      <div class="top">
        <b>Tilopay Demo</b>
        <span>WKSP_PRUEBAS</span>
      </div>
      <div class="main-body">
        <div class="tp-checkout">
          <div class="hero">
            <img src="../../assets/tilopay_icon.svg" alt="Tilopay" />
            <div>
              <p class="kicker">Tilopay Demo</p>
              <h1>Checkout</h1>
            </div>
          </div>
          <div class="amount">
            <span class="lbl">Monto</span>
            <strong>₡ 100.00</strong>
            <small>Orden NS-20260911-00000034 · CRC</small>
          </div>
          <form action="callback.html">
            <label>Método de pago</label>
            <select>
              <option>Tarjeta de crédito o débito</option>
              <option>SINPE Móvil</option>
            </select>
            <label>Tarjetas guardadas</label>
            <select><option>Nueva tarjeta</option></select>
            <label>Número</label>
            <input value="4111111111111111" autocomplete="off" />
            <label>Vence (MM/AA)</label>
            <input value="12/28" />
            <label>CVV</label>
            <input type="password" value="123" autocomplete="off" />
            <button class="pay" type="submit">Pagar</button>
            <button class="sinpe" type="button">Ver datos SINPE</button>
          </form>
          <p class="secure">Pago seguro · PCI via Tilopay SDK · tarjeta de prueba sandbox</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
